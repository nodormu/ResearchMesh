[project]
name = "linux-cli-research-client-for-claude"
version = "0.1.0"
description = "Claude Research Assistant for Linux CLI with extended tools and functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib (used by main.py) is stdlib only from 3.11
dependencies = [
    "anthropic>=0.51.0",
    "mcp[cli]>=1.8.0",
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.0",
    "playwright>=1.40.0",
    # Local tool backings — imported lazily by the tool that needs them.
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "pexpect>=4.9",
    "ruamel.yaml>=0.18",
    "tomlkit>=0.12",
    "jsonpath-ng>=1.6",
    "duckdb>=0.10",
    "send2trash>=1.8",
]
