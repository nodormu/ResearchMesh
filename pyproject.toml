[project]
name = "ResearchMesh"
version = "0.2.0"
description = "ResearchMesh, a Linux CLI Research Client for Claude is a command-line chat client for the Anthropic API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib (used by main.py) is stdlib only from 3.11
dependencies = [
    "anthropic>=0.51.0",
    "mcp[cli]>=1.8.0,<2",   # <2 is required, not caution — see requirements.txt
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.0",
    "playwright>=1.40.0",
    # Local tool backings — imported lazily by the tool that needs them.
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "pexpect>=4.9",
    "ruamel.yaml>=0.18",
    "tomlkit>=0.12",
    "jsonpath-ng>=1.6",
    "duckdb>=0.10",
    "send2trash>=1.8",
    "pyautogui>=0.9.54",
    "pillow>=10.0",
]

# Ruff is NOT a dependency of this project and nothing runs it automatically —
# there is still no CI, no pre-commit hook, no test suite. This section exists
# only so that `ruff check .`, if you happen to run it by hand, comes back clean
# instead of returning ~39 findings that are all deliberate. The alternative was
# a paragraph of prose telling each reader which findings to ignore, which
# drifted every time the code was touched.
#
# `select` is intentionally left at ruff's defaults rather than pinned. Those
# defaults do change between ruff versions (BLE001/S110/PLW1510 only started
# appearing around 0.16), so a new release may surface new findings here — that
# is the intended behaviour: you get told about the new rule, and the exemptions
# below still hold.
[tool.ruff.lint]
ignore = [
    # Blanket `except Exception`/`except BaseException` is the architecture, not
    # an oversight: every local tool must catch anything and return an error
    # string rather than crash the chat loop, and every shutdown/cleanup path
    # must not be able to fail at all. Narrowing these has already caused one
    # real bug — see "Shutdown is isolated per tool" in CLAUDE.md.
    "BLE001",
    # `Optional[X]` rather than `X | None`, 6× in mcp_client.py. Cosmetic; the
    # churn isn't worth it. New code is free to use either.
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# One blocking `open()` reading config.toml at the top of a standalone
# diagnostic script. True by the letter of the rule, irrelevant in context:
# there is no concurrent work to starve.
"mcp_client.py" = ["ASYNC230"]
