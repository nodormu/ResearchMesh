[project]
name = "ResearchMesh"
version = "0.2.0"
description = "ResearchMesh, a Linux CLI Research Client for Claude is a command-line chat client for the Anthropic API."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib (used by main.py) is stdlib only from 3.11
dependencies = [
    "anthropic>=1,<2",
    "mcp[cli]>=2.0,<3",     # 2.0 is a breaking major — see requirements.txt
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.0",
    "playwright>=1.40.0",
    # Local tool backings — imported lazily by the tool that needs them.
    "jupyter_client>=8.9.1",   # CurveZMQ transport encryption — see requirements.txt
    "ipykernel>=7.0",
    "pexpect>=4.9",
    "ruamel.yaml>=0.18",
    "tomlkit>=0.12",
    "jsonpath-ng>=1.6",
    "duckdb>=0.10",
    "send2trash>=1.8",
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "dbus-next>=0.2.3",
    "httpx2",                  # `text_embeddings`/`vision_query` — already pulled in
                               # transitively by both `anthropic` and `mcp`, listed
                               # explicitly since these modules import it directly
    "piper-tts",               # `speak` — see requirements.txt for the full note
    "faster-whisper",          # `listen` — see requirements.txt for the full note
    "mido[ports-rtmidi]>=1.3", # `midi1` — see requirements.txt for the full note
    "cffi>=1.15",              # `midi1` ports — see requirements.txt for the full note
    "ruff>=0.16",              # linter; see requirements.txt
    "mypy>=2.0",               # type checker, a CI gate; see requirements.txt
]

# Ruff is a project dependency. CI (.github/workflows/ci.yml) runs `ruff check .` on
# every push and PR. This section lists the deliberate exemptions, so a clean run is
# the baseline and no prose has to tell readers which findings to ignore.
#
# `select` is left at ruff's defaults rather than pinned. The defaults change between
# ruff versions, so a new release may surface new findings; that is intended, and the
# exemptions below still hold.
[tool.ruff]
# scripts/ is gitignored (machine-local convenience tooling assuming sibling
# repo clones that only exist on this dev box — see its own .gitignore entry)
# but still a real directory `ruff check .` would otherwise see and lint. A
# fresh clone never has this directory at all, so real CI never lints it —
# excluding it here keeps a local run matching what CI actually checks.
exclude = ["scripts"]

[tool.ruff.lint]
ignore = [
    # Blanket `except Exception`/`except BaseException` is deliberate: every local tool
    # must catch anything and return an error string rather than crash the chat loop,
    # and every shutdown/cleanup path must not be able to fail at all. Narrowing them
    # breaks that contract; see "Shutdown is isolated per tool" in CLAUDE.md.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# One blocking `open()` reading config.toml at the top of a standalone
# diagnostic script. True by the letter of the rule, irrelevant in context:
# there is no concurrent work to starve.
"mcp_client.py" = ["ASYNC230"]

# `mypy .` should come back clean, the same bar as `ruff check .`.
#
# It guards a dependency changing underneath the code: mypy type-checks against the
# *installed* packages, so a renamed attribute (such as the mcp 1.x -> 2.x field
# renames) is named in one run, including in `core/tools.py`, which smoke_test.py
# cannot reach because it never calls an MCP tool and which would otherwise fail as
# an AttributeError on the first real delegation.
#
# Left at mypy's defaults: bodies of unannotated functions are not checked, so
# this is a floor, not a straitjacket. Annotating a function opts it in.
[tool.mypy]
# scripts/ is gitignored and absent from a fresh clone, as in [tool.ruff]'s exclude.
exclude = "^scripts/"
# The per-tool backings (duckdb, playwright, pyautogui, jupyter_client,
# pexpect, ruamel, tomlkit, jsonpath_ng, send2trash) are imported lazily inside
# their tools, so they are legitimately absent from a bare environment: CI installs
# only the five module-level dependencies. Without this, each of those imports would
# be an error about a package meant to be missing. Wrong imports of installed
# packages still fail.
ignore_missing_imports = true
