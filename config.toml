# ResearchMesh, a Linux CLI Research Client for Claude — configuration.
#
# Non-secret settings only. MCP bearer tokens are NOT stored here: each server
# names the environment variable that holds its token (see README.md).

[claude]
# Models for /model. This array is a cache: core/claude.py's
# refresh_claude_models() scans Anthropic's /v1/models once model_scan_ttl_hours
# has passed and rewrites it here, one entry per model family, newest first,
# sonnet first when present. A new session starts on the first entry.
# `/model swap <name/index>` changes the model for the session only and never
# edits this file. A hand edit (e.g. to pin a dated snapshot) lasts until the
# next scan.
claude_models = ["claude-sonnet-5-5", "claude-opus-5-5", "claude-fable-5-1", "claude-haiku-4-5-20251001"]

# Set automatically by refresh_claude_models() whenever claude_models above
# is refreshed from a live scan. Do not hand-edit except to force an
# immediate rescan on the next startup by deleting this line entirely.
# claude_models_checked_at = "2026-01-01T00:00:00+00:00"

# How many hours a live scan result is trusted before refresh_claude_models()
# re-scans /v1/models again. 24 is the default if this key is absent —
# Anthropic doesn't ship new models more than roughly once a day, and a
# smaller number just adds network calls to every other process start for
# no practical benefit.
model_scan_ttl_hours = 24
claude_models_checked_at = "2026-10-02T18:17:01.064404+00:00"

[bash]
# Shell for the local `bash` tool, `bash_session` and `interactive_run`: an
# absolute path or a bare name resolved via $PATH. Unset, blank or unresolvable
# falls back to /bin/bash. Python's shell=True alone would use /bin/sh, which is
# dash on Ubuntu/Debian and breaks bash-only syntax ([[ ]], process
# substitution, arrays). If it resolves to zsh, apply_shell_prelude() in
# core/claude_learned_schemas.py restores bash-style word splitting and glob
# no-match behavior; zsh's 1-based array indices remain a difference (KSH_ARRAYS
# would fix them but changes more). Resolved once at start; restart to change.
shell = "/bin/bash"

[mcp]
# Set enabled = false to skip every MCP server and run with local tools only.
enabled = false

# MCP servers to connect to. Every reachable one connects and its tools join the
# single list Claude sees; one that fails prints a warning and is skipped. Two entry
# shapes:
#
# 1) Streamable HTTP (a server already running elsewhere):
#   name       label used as the client id and in messages
#   url        the server's Streamable HTTP endpoint
#   token_env  the environment variable holding this server's bearer token. Omit for
#              a server that needs no auth. Never put the token here; this file is
#              committed.
#
# 2) stdio (a local server main.py launches as a subprocess, JSON-RPC over
#    stdin/stdout, no port):
#   name       label used as the client id and in messages
#   command    full argv as a list, e.g. ["node", "/path/to/bin.js"]
#   env        extra environment variables for the subprocess (the MCP SDK merges
#              them with a safe default set: PATH, HOME, ...)
#
# `enabled` (default true) works on either shape; set it false to park a server
# without deleting its line.
#
# `~`, `$USER`, `$HOME` and `${VAR}` in `command`, `url` and the *values* of `env`
# are expanded from the environment (main.py `_expand_paths`). `env` keys are left
# alone. An undefined variable is left as written, so a typo shows up in the startup
# warning.
#
# Order is precedence: if two servers offer the same tool name, the first listed
# wins (`ToolManager._tool_owners` resolves owners by insertion order) and the other
# copy is unreachable, not reported. Keep epic-official-mcp above unreal: the unreal
# fork was deduped against Epic's toolsets, so Epic owns anything both expose.
#
# The absolute paths below are machine-specific; change them for your servers.
# Every entry is commented out so a fresh clone starts clean; uncomment the ones you
# run and set `[mcp].enabled = true`.
servers = [
#  { name = "n8n",    url = "http://192.168.2.12:5678/mcp-server/http", token_env = "N8N_MCP_TOKEN" }, # works
#  { name = "alpaca", url = "http://192.168.2.12:8000/mcp" }, # works https://github.com/alpacahq/alpaca-mcp-server
#  { name = "scribus", url = "http://127.0.0.1:8765/mcp" },
  # ^ CHANGED 2026-09-02: switched from a `command=[...]` stdio-spawned
  #   subprocess to a plain HTTP url, matching the n8n/alpaca pattern above.
  #   User runs the server themselves in their own terminal (so its logs are
  #   directly visible, not buried in whatever wraps this client's stdout):
  #     /home/$USER/scribus-venv/bin/scribus-mcp --http 127.0.0.1:8765
  #   `/mcp` is FastMCP's fixed default mount path for streamable-http —
  #   confirmed via `FastMCP(...).settings.streamable_http_path`, not
  #   guessed. Leave that terminal running; ResearchMesh just connects to
  #   the port, it doesn't own the process anymore. Restart ResearchMesh
  #   after editing this line, same as any MCP config change.
  #   Reasoning for the switch: this MCP server has TWO ways to reach real
  #   Scribus — headless (spawns a fresh `scribus -g -py <script>` per call)
  #   and interactive (a bridge.spy script loaded into an already-open GUI
  #   Scribus via Script > Execute Script, talking over a local TCP loopback
  #   the bridge opens). `mode="auto"` silently prefers interactive but
  #   FALLS BACK to headless with no warning if the bridge isn't reachable —
  #   and a headless spawn colliding with an already-open GUI Flatpak
  #   instance was the actual root cause of a crash-on-every-query loop
  #   (full root-cause chain in scribus_mcp_setup.md memory). Running the
  #   server via `--http` in its own terminal doesn't fix that by itself —
  #   it's orthogonal — but it makes the server's own stdout/stderr directly
  #   visible in real time instead of wrapped by config.toml's stdio-spawn
  #   plumbing, which is what made the "silent auto-fallback" so hard to
  #   see happening in the first place.
  #   scribus-mcp still wraps https://pypi.org/project/scribus-mcp/ (the
  #   Scribus 1.7 Scripter API; this host runs Scribus 1.6.5 via Flatpak
  #   net.scribus.Scribus — everything works except a handful of 1.7+-only
  #   tools like create_qr_code_block, which report a clean structured
  #   error instead of crashing). Still lives in its OWN venv
  #   (/home/$USER/scribus-venv, mcp==1.29.1 pinned), NOT tif-env — see
  #   scribus_mcp_setup.md for the mcp==2.0.0 FastMCP-import conflict that
  #   forced the separate venv. SCRIBUS_BIN / XDG_RUNTIME_DIR /
  #   SCRIBUS_MCP_USE_XVFB env vars that used to live in this entry's `env`
  #   table now need to be set in the shell that launches `scribus-mcp
  #   --http` by hand (or exported in that terminal / a wrapper script) —
  #   they no longer come from config.toml.
#  { name = "unity", command = ["/home/$USER/.unity/relay/relay_linux", "--mcp", "--project-path", "/run/media/invent/POD2/unity-projects/Burger_Order_Match_Stack"] },
#  { name = "vs-code", url = "http://127.0.0.1:3000/mcp" }, # works
#  { name = "blender", url = "http://127.0.0.1:8033/" }, # works https://projects.blender.org/lab/blender_mcp/src/branch/main/mcp
#  { name = "epic-official-mcp", url = "http://127.0.0.1:8000/mcp" }, # works, uses epic_official_mcp.md
  # ^ Epic's own official Unreal MCP plugin, served by the running editor —
  #   there is no separate process to start, and nothing listens on :8000
  #   until UE 5.8.1 is open with the plugin enabled, so expect a connect
  #   warning and a skip otherwise. It exposes toolsets rather than a flat
  #   tool list, and which ones appear depends on the project's enabled
  #   plugins — so the set grows as you enable more (see the NEW markers in
  #   epic_official_mcp.md).
#  { name = "unreal", command = ["node", "/run/media/$USER/POD2/unreal-mcp-additional-tools/dist/bin.js", "--project-path", "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Unreal-Projects/5.8.1-Projects/Test_MCP_Project/Test_MCP_Project.uproject", "--engine-path", "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Linux_Unreal_Engine_5.8.1"], env = {DOTNET_ROOT = "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Linux_Unreal_Engine_5.8.1/Engine/Binaries/ThirdParty/DotNet/10.0/linux-x64",DOTNET_ROOT_X64 = "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Linux_Unreal_Engine_5.8.1/Engine/Binaries/ThirdParty/DotNet/10.0/linux-x64"}},
  # ^ works, uses unreal_management.md — this is nodormu/unreal-mcp-additional-tools
  #   (https://github.com/nodormu/unreal-mcp-additional-tools), forked from
  #   sam-david/unreal-mcp and deduplicated against Epic's official server so the two
  #   form a clean union with no functional overlap — stdio transport, confirmed
  #   present & runnable at that path (built dist/bin.js exists, `node dist/bin.js`
  #   launches and blocks on stdin as expected for an MCP stdio server).
  #   Needs UE 5.x open with its editor's Python Editor Script Plugin's "Enable Remote
  #   Execution" checked (see the repo README) for most tools to actually work end-to-end;
  #   the connection itself doesn't require that.
  #   If you want it scoped to one Unreal project, uncomment and fill in the env line below
  #   (or drop a .unrealmcp.json with {"projectPath": "."} in that project's directory instead —
  #   see the repo README's "Config File" section for the full set of available keys):
  #   { name = "unreal", command = ["node", "/run/media/$USER/POD2/unreal-mcp-additional-tools/dist/bin.js"],
  #     env = { UNREAL_MCP_PROJECT_PATH = "/path/to/YourProject.uproject" } },
#  { name = "shopify-dev-mcp", command = ["npx", "-y", "@shopify/dev-mcp@latest"] },
  # ^ Shopify's official dev MCP server (https://www.npmjs.com/package/@shopify/dev-mcp).
  #   stdio transport, spawned fresh via npx each time ResearchMesh starts — no
  #   separate process to run by hand. Confirmed live: `npx -y @shopify/dev-mcp@latest`
  #   fetches and launches cleanly, printing "Shopify Dev MCP Server vX.Y.Z running on
  #   stdio" and blocking on stdin as expected for an MCP server. No env/API key needed
  #   for the base tools; the `shopify` CLI itself (`@shopify/cli`, separately installed
  #   via npm at ~/nodejs/bin/shopify) still needs its own `shopify auth login` if any
  #   tool call ends up touching a real store.
]

# For a local stdio MCP server passed on the command line instead of listed
# above (equivalent to a `command` entry, but only for a Python script):
#   python main.py path/to/server.py

[embeddings]
# `text_embeddings` calls an HTTP embedding server you run or pay for; Anthropic
# has no embeddings endpoint. Any server speaking the OpenAI-compatible
# `/v1/embeddings` shape works (text-embeddings-inference, llama.cpp's server,
# Ollama, vLLM, LM Studio, a paid provider). Read from disk on every call, so an
# edit applies without a restart.
#
#   url             the server's endpoint. Required; until it is set the tool
#                   returns an error naming this key.
#   model           model name forwarded in the request body. Most single-model
#                   servers ignore it. Overridable per call.
#   request_format  "openai" (default) posts {"input": [...], "model": ...} and
#                   expects {"data": [{"embedding": [...]}, ...]}. "simple" posts
#                   {"text": [...]}. A response of {"embedding": [...]} or
#                   {"embeddings": [[...]]} is accepted with either format.
#   api_key_env     name of the environment variable holding a bearer token,
#                   like `token_env` in an `[mcp].servers` entry. Never put the
#                   token here; this file is committed.
#   timeout         request timeout in seconds (default 30).
#
# Voyage AI:
#   url = "https://api.voyageai.com/v1/embeddings"
#   model = "voyage-2"
#   api_key_env = "VOYAGE_API_KEY"
#
# A server on the LAN:
# url = "http://192.168.2.12:8080/v1/embeddings"
# model = "nomic-embed"
# request_format = "openai"
# api_key_env = "EMBEDDINGS_API_KEY"
# timeout = 90

[vision]
# `vision_query` asks about an image through an OpenAI-compatible vision chat
# server you run (llama.cpp's server, vLLM, LM Studio, ...) instead of sending
# the image to Anthropic. Read from disk on every call.
#
# There is no fallback to Claude's own vision. If `url` is unset or the request
# fails, the tool returns {"status": "local_unavailable", ...} and stops; using
# Claude's vision on the same image is a separate decision made in conversation.
#
#   url          the server's chat endpoint, e.g.
#                http://host:port/v1/chat/completions. Required; until it is set
#                the tool returns local_unavailable.
#   model        model name forwarded in the request body; it must match the
#                server's routing name, not necessarily the file name.
#                Overridable per call.
#   max_tokens   max output tokens (default 4000). A reasoning vision model
#                spends part of the budget on invisible reasoning_content; a low
#                value can use all of it and return an empty or truncated answer
#                with "finish_reason": "length". Overridable per call.
#   timeout      request timeout in seconds (default 180).
#   api_key_env  as for [embeddings].
#
# Example, for a llama.cpp router that also serves the embedding model above:
# url = "http://192.168.2.12:8080/v1/chat/completions"
# model = "glm-4.6v-flash"
# max_tokens = 4000
# timeout = 180
# api_key_env = "VISION_API_KEY"

[speak]
# `speak`: local text-to-speech through Piper (PyPI `piper-tts`, not
# `sudo apt install piper`, which installs an unrelated GTK app for configuring
# gaming mice). No cloud TTS API. Read from disk on every call.
#
#   enabled       default true. A hard off-switch checked before voice_model, so
#                 a disabled tool touches no filesystem and spawns no process.
#   voice_model   path to a Piper .onnx voice file with a matching <path>.json
#                 next to it. Required; until it is set the tool returns
#                 not_configured.
#   sink          PipeWire sink name (`pactl list sinks short`); the system
#                 default if unset.
#   timeout       seconds for synthesis and for playback, each (default 30).
#
# To fill these in, ask Claude: it can run `pactl list sinks short` and edit this
# file with `config_edit`, which keeps the comments. The values below are examples
# for one machine, not defaults; keep them commented out in commits.
# enabled = true
# voice_model = "/home/invent/models/piper_voices/en_US-lessac-medium.onnx"
# sink = "alsa_output.usb-Razer_Razer_USB_Sound_Card_00000000-00.analog-stereo"
# timeout = 120

[listen]
# `listen`: local speech-to-text through faster-whisper (CTranslate2, on CPU).
# Read from disk on every call.
#
#   enabled       default true; checked before `device`, so a disabled tool never
#                 opens the microphone.
#   device        PipeWire source name (`pactl list sources short`). Required;
#                 until it is set the tool returns not_configured.
#   model_size    faster-whisper model size: tiny, base, small, medium or
#                 large-v3 (default base).
#   default_duration_seconds   recording length when the caller gives none (8).
#   max_duration_seconds       cap on any requested duration (30).
#
# To fill these in, ask Claude: it can run `pactl list sources short` and edit
# this file with `config_edit`. The values below are examples for one machine, not
# defaults; keep them commented out in commits.
# enabled = true
# device = "alsa_input.usb-Razer_Razer_USB_Sound_Card_00000000-00.analog-stereo"
# model_size = "base"
# default_duration_seconds = 8
# max_duration_seconds = 30
