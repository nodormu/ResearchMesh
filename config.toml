# ResearchMesh, a Linux CLI Research Client for Claude — configuration.
#
# Non-secret settings only. MCP bearer tokens are NOT stored here: each server
# names the environment variable that holds its token (see README.md).

[claude]
# Anthropic model to use. The CLAUDE_MODEL environment variable overrides this.
model = "claude-sonnet-5"

[mcp]
# Set enabled = false to skip every MCP server and run with local tools only.
enabled = false

# MCP servers to connect to. Every reachable/launchable one connects and its
# tools are merged into the single list Claude sees; one that fails prints a
# warning and is skipped, so it doesn't stop the app. Two entry shapes:
#
# 1) Streamable HTTP (a server already running elsewhere, reached over the network):
#   name       label used as the client id and in messages
#   url        the server's Streamable HTTP endpoint
#   token_env  optional — the environment variable holding this server's bearer
#              token. Omit for a server that needs no auth. Never put the token
#              itself here; this file is committed.
#
# 2) stdio (a local server main.py launches itself as a subprocess, talking
#    JSON-RPC over stdin/stdout — no port, no separate process to start by hand):
#   name       label used as the client id and in messages
#   command    full argv as a list, e.g. ["node", "/path/to/bin.js"]
#   env        optional table of extra environment variables for the
#              subprocess (merged with a safe default set — PATH, HOME, etc.
#              — by the MCP SDK; you only need to list the extras).
#
# `enabled` (optional, default true) works on either shape — park a server
# without deleting its line.
#
# Paths and URLs are expanded before use: `~`, `$USER`, `$HOME`, `${VAR}` in
# `command`, `url` and the *values* of `env` are substituted from the
# environment (main.py `_expand_paths`), so nobody's username has to be baked
# into this file. `env`'s keys are variable names and are left alone. An
# undefined variable is left as written rather than becoming empty, so a typo
# shows up in the startup warning instead of producing a silently wrong path.
#
# Order is precedence. If two servers offer the same tool name, the first
# entry listed wins — `ToolManager._tool_owners` resolves owners by insertion
# order — and the loser's copy is unreachable rather than reported. Keep
# epic-official-mcp above unreal for that reason: the fork below was deduped
# against Epic's toolsets, so Epic is the canonical owner of anything the two
# might ever both expose.
#
# The absolute paths below are still machine-specific — be sure you change
# these for your servers. Every entry is commented out by default so a fresh
# clone starts clean; uncomment the ones you actually run and set
# `enabled = true` above.
servers = [
#  { name = "n8n",    url = "http://192.168.2.12:5678/mcp-server/http", token_env = "N8N_MCP_TOKEN" }, # works
#  { name = "alpaca", url = "http://192.168.2.12:8000/mcp" }, # works https://github.com/alpacahq/alpaca-mcp-server
#  { name = "scribus", url = "http://127.0.0.1:8765/mcp" },
  # ^ CHANGED 2026-09-02: switched from a `command=[...]` stdio-spawned
  #   subprocess to a plain HTTP url, matching the n8n/alpaca pattern above.
  #   User runs the server themselves in their own terminal (so its logs are
  #   directly visible, not buried in whatever wraps this client's stdout):
  #     /home/$USER/scribus-venv/bin/scribus-mcp --http 127.0.0.1:8765
  #   `/mcp` is FastMCP's fixed default mount path for streamable-http —
  #   confirmed via `FastMCP(...).settings.streamable_http_path`, not
  #   guessed. Leave that terminal running; ResearchMesh just connects to
  #   the port, it doesn't own the process anymore. Restart ResearchMesh
  #   after editing this line, same as any MCP config change.
  #   Reasoning for the switch: this MCP server has TWO ways to reach real
  #   Scribus — headless (spawns a fresh `scribus -g -py <script>` per call)
  #   and interactive (a bridge.spy script loaded into an already-open GUI
  #   Scribus via Script > Execute Script, talking over a local TCP loopback
  #   the bridge opens). `mode="auto"` silently prefers interactive but
  #   FALLS BACK to headless with no warning if the bridge isn't reachable —
  #   and a headless spawn colliding with an already-open GUI Flatpak
  #   instance was the actual root cause of a crash-on-every-query loop
  #   (full root-cause chain in scribus_mcp_setup.md memory). Running the
  #   server via `--http` in its own terminal doesn't fix that by itself —
  #   it's orthogonal — but it makes the server's own stdout/stderr directly
  #   visible in real time instead of wrapped by config.toml's stdio-spawn
  #   plumbing, which is what made the "silent auto-fallback" so hard to
  #   see happening in the first place.
  #   scribus-mcp still wraps https://pypi.org/project/scribus-mcp/ (the
  #   Scribus 1.7 Scripter API; this host runs Scribus 1.6.5 via Flatpak
  #   net.scribus.Scribus — everything works except a handful of 1.7+-only
  #   tools like create_qr_code_block, which report a clean structured
  #   error instead of crashing). Still lives in its OWN venv
  #   (/home/$USER/scribus-venv, mcp==1.29.1 pinned), NOT tif-env — see
  #   scribus_mcp_setup.md for the mcp==2.0.0 FastMCP-import conflict that
  #   forced the separate venv. SCRIBUS_BIN / XDG_RUNTIME_DIR /
  #   SCRIBUS_MCP_USE_XVFB env vars that used to live in this entry's `env`
  #   table now need to be set in the shell that launches `scribus-mcp
  #   --http` by hand (or exported in that terminal / a wrapper script) —
  #   they no longer come from config.toml.
#  { name = "unity", command = ["/home/$USER/.unity/relay/relay_linux", "--mcp", "--project-path", "/run/media/invent/POD2/unity-projects/Burger_Order_Match_Stack"] },
#  { name = "vs-code", url = "http://127.0.0.1:3000/mcp" }, # works
#  { name = "blender", url = "http://127.0.0.1:8033/" }, # works https://projects.blender.org/lab/blender_mcp/src/branch/main/mcp
#  { name = "epic-official-mcp", url = "http://127.0.0.1:8000/mcp" }, # works, uses epic_official_mcp.md
  # ^ Epic's own official Unreal MCP plugin, served by the running editor —
  #   there is no separate process to start, and nothing listens on :8000
  #   until UE 5.8.1 is open with the plugin enabled, so expect a connect
  #   warning and a skip otherwise. It exposes toolsets rather than a flat
  #   tool list, and which ones appear depends on the project's enabled
  #   plugins — so the set grows as you enable more (see the NEW markers in
  #   epic_official_mcp.md).
#  { name = "unreal", command = ["node", "/run/media/$USER/POD2/unreal-mcp-additional-tools/dist/bin.js", "--project-path", "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Unreal-Projects/5.8.1-Projects/Test_MCP_Project/Test_MCP_Project.uproject", "--engine-path", "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Linux_Unreal_Engine_5.8.1"], env = {DOTNET_ROOT = "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Linux_Unreal_Engine_5.8.1/Engine/Binaries/ThirdParty/DotNet/10.0/linux-x64",DOTNET_ROOT_X64 = "/run/media/$USER/POD2/Unreal-Engine-zip-deploys/Linux_Unreal_Engine_5.8.1/Engine/Binaries/ThirdParty/DotNet/10.0/linux-x64"}},
  # ^ works, uses unreal_management.md — this is nodormu/unreal-mcp-additional-tools
  #   (https://github.com/nodormu/unreal-mcp-additional-tools), forked from
  #   sam-david/unreal-mcp and deduplicated against Epic's official server so the two
  #   form a clean union with no functional overlap — stdio transport, confirmed
  #   present & runnable at that path (built dist/bin.js exists, `node dist/bin.js`
  #   launches and blocks on stdin as expected for an MCP stdio server).
  #   Needs UE 5.x open with its editor's Python Editor Script Plugin's "Enable Remote
  #   Execution" checked (see the repo README) for most tools to actually work end-to-end;
  #   the connection itself doesn't require that.
  #   If you want it scoped to one Unreal project, uncomment and fill in the env line below
  #   (or drop a .unrealmcp.json with {"projectPath": "."} in that project's directory instead —
  #   see the repo README's "Config File" section for the full set of optional keys):
  #   { name = "unreal", command = ["node", "/run/media/$USER/POD2/unreal-mcp-additional-tools/dist/bin.js"],
  #     env = { UNREAL_MCP_PROJECT_PATH = "/path/to/YourProject.uproject" } },
]

# For a local stdio MCP server passed on the command line instead of listed
# above (equivalent to a `command` entry, but only for a Python script):
#   python main.py path/to/server.py

[embeddings]
# There is no Anthropic-hosted embeddings endpoint — the documented path is
# Voyage AI, a separate paid API. The `text_embeddings` tool exists so Claude
# has vector embeddings available at all without adding that second bill:
# uncomment `url` below and it calls whatever HTTP embedding server you
# already run instead — the same private compute an Unreal Engine project's
# own embedding settings might already point at, or any self-hosted server
# speaking the common OpenAI-compatible `/v1/embeddings` shape
# (text-embeddings-inference, llama.cpp's server, Ollama, vLLM, LM Studio, ...).
#
# Like everything else in this file, it's read fresh on every call — editing
# this block (by hand or with the `config_edit` tool) and calling
# `text_embeddings` again picks it up with no restart.
#
#   url             your embedding server's endpoint. Required — the tool is
#                   still declared to Claude either way, but returns an error
#                   telling you to set this until you do.
#   model           optional model name forwarded in the request body. Most
#                   single-model private servers ignore it; leave it unset if
#                   yours does. Overridable per call.
#   request_format  "openai" (default) posts {"input": [...], "model": ...}
#                   and expects {"data": [{"embedding": [...]}, ...]} back —
#                   the shape most self-hosted servers speak. "simple" posts
#                   {"text": [...]} instead, for a bespoke server that wants
#                   that shape. Either way, a response of
#                   {"embedding": [...]} or {"embeddings": [[...]]} is also
#                   accepted regardless of which format was sent.
#   api_key_env     optional — name of the environment variable holding a
#                   bearer token for this server, the same `token_env`
#                   pattern an `[mcp].servers` entry uses. Never put the
#                   token itself here; this file is committed.
#   timeout         optional request timeout in seconds (default 30).
#
# Nothing above is specific to self-hosted compute — it's the same generic
# OpenAI-compatible /v1/embeddings shape, so a paid provider works with zero
# code changes too. Voyage AI (the path Anthropic's own docs point to) is one
# example:
#
#   url = "https://api.voyageai.com/v1/embeddings"
#   model = "voyage-2"                  # or voyage-3.5, voyage-large-2, ...
#   api_key_env = "VOYAGE_API_KEY"      # set VOYAGE_API_KEY in your shell,
#                                        # never here — this file is committed
#
# The example below instead points at a self-hosted llama.cpp server on the
# LAN — swap in whatever you actually run:
# url = "http://192.168.2.12:8080/v1/embeddings"
# model = "nomic-embed"
# request_format = "openai"
# api_key_env = "EMBEDDINGS_API_KEY"
# timeout = 30
